name: Device matrix
# The launcher on many kinds of phone: Android 9 to 15, small to tall screens, a tablet, gestures and buttons,
# large text and Arabic (right-to-left). Each device's screens land on its own devices-<name> branch.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run just this device (its name), or leave empty for all"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android9-nexus5,     api: 28, profile: "Nexus 5",   nav: "",            scale: "",    locale: "" }
          - { name: android10-small,     api: 29, profile: "Nexus S",   nav: "threebutton", scale: "",    locale: "" }
          - { name: android12-pixel5-big-text, api: 31, profile: pixel_5, nav: "gestural", scale: "1.3", locale: "" }
          - { name: android13-pixel7-arabic,   api: 33, profile: pixel_7, nav: "threebutton", scale: "", locale: "ar-EG" }
          - { name: android14-tablet,    api: 34, profile: pixel_c,   nav: "gestural",    scale: "",    locale: "" }
          - { name: android15-pixel7pro, api: 35, profile: pixel_7_pro, nav: "gestural", scale: "",   locale: "" }
          - { name: android11-pixel4-buttons, api: 30, profile: pixel_4, nav: "threebutton", scale: "1.15", locale: "fr-FR" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;34.0.0" >/dev/null
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          ANDROID_JAR=$ANDROID_HOME/platforms/android-28/android.jar APKTOOL=$PWD/apktool.jar D8=d8 ./build.sh test/app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          NAME: ${{ matrix.name }}
          ONLY: ${{ github.event.inputs.only }}
          NAV: ${{ matrix.nav }}
          SCALE: ${{ matrix.scale }}
          LOCALE: ${{ matrix.locale }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4
          working-directory: test
          script: bash devices.sh
      - name: Keep the screens on devices-${{ matrix.name }}
        if: always() && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name)
        run: |
          cd test/rec || exit 0
          git init -q -b devices-${{ matrix.name }} && git add -A
          git -c user.name=ci -c user.email=ci@velthon commit -qm "devices ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" devices-${{ matrix.name }}
