name: Screens for the commercial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build (debug-signed)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;34.0.0" >/dev/null
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          DEBUGGABLE=1 ANDROID_JAR=$ANDROID_HOME/platforms/android-28/android.jar APKTOOL=$PWD/apktool.jar D8=d8 ./build.sh test/app.apk
      - uses: actions/upload-artifact@v4
        with: { name: velthon-launcher-debug-apk, path: test/app.apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4
          working-directory: test
          script: bash marketing.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-test-screens, path: test/rec }
      - name: Keep the screens on the marketing-shots branch
        if: always()
        run: |
          cd test/rec
          git init -q -b marketing-shots && git add -A
          git -c user.name=ci -c user.email=ci@velthon commit -qm "screens ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" marketing-shots
