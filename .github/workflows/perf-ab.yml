name: Performance old vs new
# The new version against an older one (default: v3.71) on the same emulator, in turns.
on:
  workflow_dispatch:
    inputs:
      old:
        description: "Commit of the older version"
        required: false
        default: "797da85"
permissions:
  contents: write
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build both
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;34.0.0" >/dev/null
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          DEBUGGABLE=1 ANDROID_JAR=$ANDROID_HOME/platforms/android-28/android.jar APKTOOL=$PWD/apktool.jar D8=d8 ./build.sh test/new.apk
          git worktree add -q ../old ${{ github.event.inputs.old }}
          (cd ../old && DEBUGGABLE=1 ANDROID_JAR=$ANDROID_HOME/platforms/android-28/android.jar APKTOOL=$GITHUB_WORKSPACE/apktool.jar D8=d8 ./build.sh $GITHUB_WORKSPACE/test/old.apk)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4
          working-directory: test
          script: bash perf_ab.sh
      - name: Keep the numbers on the perf-ab branch
        if: always()
        run: |
          cd test/rec || exit 0
          git init -q -b perf-ab && git add -A
          git -c user.name=ci -c user.email=ci@velthon commit -qm "perf ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" perf-ab
